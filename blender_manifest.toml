schema_version = "1.0.0"

id = "blender_playvortexio_loader"
version = "0.0.1"
name = "Vortex Loader"
tagline = "Vortex place import-export and avatar downloader"
maintainer = "barbq"
type = "add-on"

blender_version_min = "5.2.0"

license = ["SPDX:MIT"]
copyright = ["2026 barbq"]

website = "https://playvortex.io"

tags = ["Object","Game Engine","Development","Animation","Import-Export","Pipeline","Scene"]

[permissions]
network = "Download playvortex.io avatar cosmetics"
files = "Import/export VRTX/JSON from/to disk"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  ".vscode/",
  "build/",
  "/.git/",
  "/.github/",
  "/github/",
  "/*.zip",
  "/*.blend1",
  "build.bat",
]